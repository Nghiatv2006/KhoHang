<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng nhập - WMS Hệ Thống</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .input-focus-effect:focus {
            box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.15);
        }
        /* Custom colors matching the design system of Stitch */
        :root {
            --primary: #00355f;
            --primary-container: #0f4c81;
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-slate-100 via-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-md">
    <div id="app" class="w-full max-w-md">
        <!-- Main Card -->
        <div class="glass-card shadow-2xl rounded-2xl p-8 transition-all duration-300 hover:shadow-indigo-100/50">
            <!-- Brand Info -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-14 h-14 bg-[#00355f] rounded-2xl flex items-center justify-center text-white mb-4 shadow-lg shadow-blue-900/20">
                    <span class="material-symbols-outlined text-[32px]">warehouse</span>
                </div>
                <h1 class="text-2xl font-bold text-[#00355f] tracking-tight">Hệ Thống WMS</h1>
                <p class="text-sm text-slate-500 mt-1">Đăng nhập tài khoản quản lý & vận hành</p>
            </div>

            <!-- Login Form -->
            <form @submit.prevent="handleLogin" class="space-y-5">
                <!-- Username -->
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Tên đăng nhập</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">person</span>
                        <input 
                            type="text" 
                            id="username" 
                            v-model="username" 
                            required 
                            class="w-full pl-10 pr-4 py-2.5 bg-white/70 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#0f4c81] input-focus-effect transition-all text-sm" 
                            placeholder="Nhập tên đăng nhập..."
                        />
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Mật khẩu</label>
                    </div>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">lock</span>
                        <input 
                            :type="showPassword ? 'text' : 'password'" 
                            id="password" 
                            v-model="password" 
                            required 
                            class="w-full pl-10 pr-10 py-2.5 bg-white/70 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#0f4c81] input-focus-effect transition-all text-sm" 
                            placeholder="Nhập mật khẩu..."
                        />
                        <button 
                            type="button" 
                            @click="showPassword = !showPassword" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#00355f] focus:outline-none"
                        >
                            <span class="material-symbols-outlined text-[20px]">
                                {{ showPassword ? 'visibility_off' : 'visibility' }}
                            </span>
                        </button>
                    </div>
                </div>

                <!-- Error Alert -->
                <div v-if="error" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl flex items-start gap-2.5 text-xs animate-shake">
                    <span class="material-symbols-outlined text-[18px] shrink-0">error</span>
                    <span>{{ error }}</span>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    :disabled="loading" 
                    class="w-full py-3 bg-[#00355f] text-white font-semibold rounded-xl hover:bg-[#0f4c81] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-blue-900/20 disabled:opacity-50 disabled:pointer-events-none transition-all shadow-md shadow-blue-900/10 flex items-center justify-center gap-2 text-sm"
                >
                    <span v-if="loading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    <span>{{ loading ? 'Đang xác thực...' : 'Đăng nhập' }}</span>
                </button>
            </form>
        </div>

        <!-- System Footer -->
        <p class="text-center text-xs text-slate-400 mt-6">© 2026 WMS Multi-branch System. Bảo mật cấp doanh nghiệp.</p>
    </div>

    <!-- Vue 3 Setup -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const username = ref('');
                const password = ref('');
                const showPassword = ref(false);
                const loading = ref(false);
                const error = ref('');

                const handleLogin = async () => {
                    loading.value = true;
                    error.value = '';

                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                username: username.value,
                                password: password.value
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.message || 'Sai tên đăng nhập hoặc mật khẩu.');
                        }

                        // Save user session details
                        localStorage.setItem('wms_user', JSON.stringify(data));
                        
                        // Redirect to index.html
                        window.location.href = '/index.html';
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        loading.value = false;
                    }
                };

                return {
                    username,
                    password,
                    showPassword,
                    loading,
                    error,
                    handleLogin
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
