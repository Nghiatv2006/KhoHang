spring.application.name=Hehe

# Server Port
server.port=${SERVER_PORT:8080}

# Database Connection Settings
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME co the de default khi dev
# DB_PASSWORD bat buoc phai set qua env var (khong co fallback de tranh ro ri khi deploy)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:warehouse_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Custom JWT Config
# JWT_SECRET bat buoc phai set qua env var (khong co fallback de dam bao bi mat token)
# JWT_EXPIRATION mac dinh 24h neu khong set
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Backup HMAC Secret (Fix 2: Khong co fallback - bat buoc phai set qua env var BACKUP_SECRET)
# Neu khong set, Spring Boot se tu choi khoi dong va bao loi ro rang.
app.backup.secret=${BACKUP_SECRET}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail Service Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.debug=true

