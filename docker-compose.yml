version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: warehub-postgres
    restart: always
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./full_schema.sql:/docker-entrypoint-initdb.d/1_full_schema.sql
      - ./migration_add_backup_and_branch_lock.sql:/docker-entrypoint-initdb.d/2_migration_add_backup_and_branch_lock.sql
      - ./seed_data.sql:/docker-entrypoint-initdb.d/3_seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehub-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: warehouse_db
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION: 86400000
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      BACKUP_SECRET: "${BACKUP_SECRET}"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./VueJs
      dockerfile: Dockerfile
    container_name: warehub-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
